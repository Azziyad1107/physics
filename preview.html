<!DOCTYPE html>
<html>
<head>
<title>Simulasi Dinamika Rotasi</title>

<style>

body{
font-family:Segoe UI;
background:#f4f6f8;
text-align:center;
}

.container{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.panel{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

canvas{
background:white;
border-radius:8px;
border:1px solid #ddd;
}

.slider{
width:100%;
}

button{
padding:8px 16px;
margin-top:10px;
border:none;
background:#1976d2;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#125aa0;
}

.controls{
text-align:left;
width:250px;
}

</style>
</head>

<body>

<h2>Simulasi Benda Menggelinding pada Bidang Miring</h2>

<div class="container">

<div class="panel controls">

<b>Jenis Benda</b><br>
<select id="benda">
<option value="bola">Bola Pejal</option>
<option value="silinder">Silinder Pejal</option>
<option value="cincin">Cincin</option>
</select>

<br><br>

<b>Massa</b><br>
<input class="slider" type="range" id="massa" min="1" max="10" step="0.1" value="5" oninput="updateLabel()">
<span id="massaLabel">5</span> kg

<br><br>

<b>Jari-jari</b><br>
<input class="slider" type="range" id="radius" min="0.5" max="3" step="0.1" value="1" oninput="updateLabel()">
<span id="radiusLabel">1</span> m

<br><br>

<b>Sudut Bidang</b><br>
<input class="slider" type="range" id="sudut" min="5" max="45" step="1" value="20" oninput="updateLabel()">
<span id="sudutLabel">20</span> °

<br><br>

<button onclick="start()">Start</button>
<button onclick="reset()">Reset</button>

<h3 id="info"></h3>

</div>

<div class="panel">
<canvas id="simulasi" width="500" height="350"></canvas>
</div>

</div>

<br>

<div class="container">

<div class="panel">
<h3>Grafik Kecepatan vs Waktu</h3>
<canvas id="grafikV" width="450" height="250"></canvas>
</div>

<div class="panel">
<h3>Grafik Momen Inersia vs Radius</h3>
<canvas id="grafikI" width="450" height="250"></canvas>
</div>

</div>

<script>

let canvas=document.getElementById("simulasi");
let ctx=canvas.getContext("2d");

let gV=document.getElementById("grafikV").getContext("2d");
let gI=document.getElementById("grafikI").getContext("2d");

let x=80;
let y=80;
let v=0;
let rot=0;
let animasi=false;
let t=0;

let dataV=[];

function updateLabel(){

massaLabel.innerText=massa.value;
radiusLabel.innerText=radius.value;
sudutLabel.innerText=sudut.value;

}

function inersia(m,r){

let jenis=document.getElementById("benda").value;

if(jenis=="bola") return (2/5)*m*r*r;
if(jenis=="silinder") return (1/2)*m*r*r;
if(jenis=="cincin") return m*r*r;

}

function percepatan(m,r,theta){

let I=inersia(m,r);

return (9.8*Math.sin(theta))/(1+(I/(m*r*r)));

}

function gambarBidang(theta){

ctx.beginPath();
ctx.moveTo(80,80);
ctx.lineTo(480,80+Math.tan(theta)*400);
ctx.stroke();

}

function gambarBola(r){

ctx.save();

ctx.translate(x,y);
ctx.rotate(rot);

ctx.beginPath();
ctx.arc(0,0,r,0,2*Math.PI);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(r,0);
ctx.stroke();

ctx.restore();

}

function gambarGaya(){

ctx.strokeStyle="red";

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x,y+40);
ctx.stroke();

ctx.fillText("mg",x,y+50);

ctx.strokeStyle="blue";

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+30,y+20);
ctx.stroke();

ctx.fillText("mg sinθ",x+35,y+20);

ctx.strokeStyle="black";

}

function update(){

let m=parseFloat(massa.value);
let r=parseFloat(radius.value);
let theta=sudut.value*Math.PI/180;

let a=percepatan(m,r,theta);
let I=inersia(m,r);

info.innerHTML="Momen Inersia = "+I.toFixed(2)+" kg m²";

if(animasi){

v+=a*0.05;

x+=v*Math.cos(theta);
y+=v*Math.sin(theta);

rot+=v/(r*30);

t+=0.05;

dataV.push(v);

}

}

function grafikKecepatan(){

gV.clearRect(0,0,450,250);

gV.beginPath();

for(let i=0;i<dataV.length;i++){

let px=i*4;
let py=250-dataV[i]*20;

if(i==0) gV.moveTo(px,py);
else gV.lineTo(px,py);

}

gV.stroke();

}

function grafikInersia(){

gI.clearRect(0,0,450,250);

let m=massa.value;

gI.beginPath();

for(let r=0.5;r<3;r+=0.1){

let I=inersia(m,r);

let px=r*120;
let py=250-I*10;

if(r==0.5) gI.moveTo(px,py);
else gI.lineTo(px,py);

}

gI.stroke();

}

function loop(){

ctx.clearRect(0,0,500,350);

let r=radius.value*30;
let theta=sudut.value*Math.PI/180;

gambarBidang(theta);
gambarBola(r);
gambarGaya();

update();

grafikKecepatan();
grafikInersia();

requestAnimationFrame(loop);

}

function start(){

animasi=true;

}

function reset(){

x=80;
y=80;
v=0;
rot=0;
t=0;
dataV=[];
animasi=false;

}

updateLabel();
loop();

</script>

</body>
</html>
